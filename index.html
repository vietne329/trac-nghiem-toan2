<style>
  :root {

      --bg: #12151b; --card: #1b2029; --text: #e6e9ef; --muted: #98a2b3; --line: #2c3340;

      --ok: #4cc38a; --ok-soft: #15301f; --bad: #ff7b7b; --bad-soft: #3a1b1b; --warn: #f0b04a;

  }

    font: 16px/1.6 "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }

  button:disabled { opacity: .5; cursor: default; }

  .q.correct { border-color: var(--ok); }
  .q.wrong { border-color: var(--bad); }

    padding: 8px 10px; cursor: pointer; user-select: none; }

  .opt input { display: none; }
  .opt .L { flex: 0 0 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    border: 1px solid var(--line); font-weight: 600; font-size: 14px; }
  .opt.sel { background: var(--accent-soft); border-color: var(--accent); }
  .opt.sel .L { background: var(--accent); color: #fff; border-color: var(--accent); }
  .done .opt { cursor: default; }
  .done .opt:hover { border-color: var(--line); }
  .opt.is-ans { background: var(--ok-soft); border-color: var(--ok); }
  .opt.is-ans .L { background: var(--ok); color: #fff; border-color: var(--ok); }
  .opt.is-wrong { background: var(--bad-soft); border-color: var(--bad); }
  .opt.is-wrong .L { background: var(--bad); color: #fff; border-color: var(--bad); }
  .foot { margin-top: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .verdict { font-weight: 600; font-size: 14px; }
  .verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); } .verdict.skip { color: var(--warn); }
  .sol { display: none; margin-top: 10px; padding: 12px 14px; border-left: 4px solid var(--ok);
    background: var(--ok-soft); border-radius: 0 8px 8px 0; font-size: 15px; }
  .sol.show { display: block; }
  .sol .ans { font-weight: 700; color: var(--ok); }

  .grid-nav { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 4px; }
  .grid-nav a { width: 34px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line);
    border-radius: 6px; font-size: 13px; color: var(--text); text-decoration: none; background: var(--card); }
  .grid-nav a.answered { background: var(--accent-soft); border-color: var(--accent); }
  .grid-nav a.correct { background: var(--ok); border-color: var(--ok); color: #fff; }
  .grid-nav a.wrong { background: var(--bad); border-color: var(--bad); color: #fff; }
  .grid-nav a.skipped { background: var(--warn); border-color: var(--warn); color: #fff; }

<script>
const F = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;

const QUESTIONS = [
  // ===== PHẦN I: TOÁN - LOGIC =====
  { n: 1, text: `Để tạo ra màu tím, ta trộn thuốc nhuộm màu đỏ và màu xanh theo tỷ lệ 3:4. Để tạo ra màu cam, ta trộn thuốc nhuộm màu đỏ và màu vàng theo tỷ lệ 3:2. Nếu lượng thuốc nhuộm màu tím và màu cam bằng nhau được trộn với nhau thì tỷ lệ thuốc nhuộm màu đỏ trong hỗn hợp mới chiếm bao nhiêu phần?`,
    opts: [F(9,20), F(18,35), F(27,40), F(1,2)], cols: 4, ans: 'B',
    sol: `Trong màu tím, màu đỏ chiếm ${F(3,7)}. Trong màu cam, màu đỏ chiếm ${F(3,5)}.<br>
      Trộn hai lượng bằng nhau (mỗi loại 1 phần) → tỷ lệ đỏ = (${F(3,7)} + ${F(3,5)}) : 2 = ${F(36,35)} : 2 = ${F(18,35)}.` },
  { n: 2, text: `15% của 40 là số nào sau đây?`, opts: ['3','8','6','5'], cols: 4, ans: 'C',
    sol: `15% × 40 = 0,15 × 40 = 6.` },
  { n: 3, text: `Số nào trong các số sau có tính chất khác các số còn lại?<br>159; 248; 963; 357; 951; 852`,
    opts: ['159','357','248','951'], cols: 4, ans: 'C',
    sol: `Các chữ số của mỗi số lập thành cấp số cộng: 1-5-9 (công sai 4), 9-6-3 (−3), 3-5-7 (2), 9-5-1 (−4), 8-5-2 (−3).<br>
      Riêng 2-4-8 là cấp số nhân (×2), không phải cấp số cộng → <b>248</b> khác các số còn lại.` },
  { n: 4, text: `Chu vi của ΔABC là:`, img: ['img/q4.png'], imgW: 260,
    opts: ['8','13','16','14'], cols: 4, ans: 'B',
    sol: `Góc C = 180° − 30° − 75° = 75° = góc B → ΔABC cân tại A ⇒ AC = AB = 5.<br>
      Chu vi = AB + AC + BC = 5 + 5 + 3 = 13.` },
  { n: 5, text: `Số nào trong các số sau là tổng của tất cả các ước số dương của số 24?`,
    opts: ['50','49','60','46'], cols: 4, ans: 'C',
    sol: `Các ước dương của 24: 1, 2, 3, 4, 6, 8, 12, 24.<br>Tổng = 1+2+3+4+6+8+12+24 = 60.` },
  { n: 6, text: `Cho tập hợp M = { ${F(1,6)}, ${F(1,4)}, ${F(2,3)}, ${F(5,6)} } và x, y là hai phần tử của M. Hỏi giá trị lớn nhất có thể của 5x − 5y?`,
    opts: [F(35,12), F(25,6), F(10,3), '4'], cols: 4, ans: 'C',
    sol: `5x − 5y = 5(x − y) lớn nhất khi x lớn nhất, y nhỏ nhất: x = ${F(5,6)}, y = ${F(1,6)}.<br>
      5 · (${F(5,6)} − ${F(1,6)}) = 5 · ${F(4,6)} = ${F(10,3)}.` },
  { n: 7, text: `Nam có 50 nghìn đồng. Hà có 110 nghìn đồng. Hỏi Nam phải đưa cho Hà bao nhiêu tiền để số tiền của Hà gấp 3 lần số tiền của Nam?`,
    opts: ['8 nghìn đồng','7 nghìn đồng','10 nghìn đồng','9 nghìn đồng'], cols: 4, ans: 'C',
    sol: `Tổng tiền không đổi: 50 + 110 = 160 nghìn. Hà gấp 3 lần Nam → Nam còn 160 : 4 = 40 nghìn.<br>
      Nam phải đưa 50 − 40 = 10 nghìn đồng.` },
  { n: 8, text: `Nếu 3x = 5y và x ≠ 0 thì ${F('x','y')} = ?`,
    opts: [F(5,3), F(3,5), F(8,3), F(3,8)], cols: 4, ans: 'A',
    sol: `3x = 5y ⇒ ${F('x','y')} = ${F(5,3)}.` },
  { n: 9, text: `Một trong ba sinh viên Nam, Hùng và Dũng đã đá bóng trúng vào cửa sổ làm vỡ kính. Khi được hỏi, ba sinh viên đó trả lời như sau:<br>
      Nam: Em không đá quả bóng đó.<br>Hùng: Không phải em! Em thấy bạn Nam đã đá quả bóng đó.<br>Dũng: Hùng nói dối đấy ạ.<br>
      Biết rằng chỉ có một bạn trong ba bạn đó nói thật. Hỏi ai đã đá quả bóng đó?`,
    opts: ['Dũng đã đá quả bóng đó','Hùng đã đá quả bóng đó','Nam đã đá quả bóng đó','Không đủ dữ kiện để xác định ai đã đá quả bóng đó'], cols: 2, ans: 'C',
    sol: `Lời Dũng phủ định lời Hùng ⇒ trong hai bạn Hùng, Dũng có đúng một người nói thật.<br>
      Vì chỉ có một người nói thật nên Nam nói dối ⇒ Nam đã đá bóng.<br>
      Kiểm tra: Hùng nói "Nam đá" – đúng; Dũng nói "Hùng nói dối" – sai. Chỉ Hùng nói thật ✔.` },
  { n: 10, text: `Nếu g(x) = 3x + √x thì giá trị của g(d² + 6d + 9) là:`,
    opts: ['3d² − 19d + 30 hoặc 3d² + 17d + 24','3d² + 19d + 30 hoặc 3d² − 17d + 24','3d² − 19d − 30 hoặc 3d² − 17d − 24','3d² + 19d + 30 hoặc 3d² + 17d + 24'], cols: 2, ans: 'D',
    sol: `d² + 6d + 9 = (d + 3)² ⇒ √(d+3)² = |d + 3| = ±(d + 3).<br>
      g = 3(d+3)² ± (d+3) = 3d² + 18d + 27 ± (d + 3)<br>
      ⇒ 3d² + 19d + 30 hoặc 3d² + 17d + 24.` },
  { n: 11, text: `Khi chia số nguyên dương x cho số nguyên dương y được số dư là 9. Nếu biết ${F('x','y')} = 96,12 thì giá trị của y là bao nhiêu?`,
    opts: ['25','75','96','48'], cols: 4, ans: 'B',
    sol: `${F('x','y')} = 96 + ${F(9,'y')} ⇒ phần thập phân ${F(9,'y')} = 0,12 ⇒ y = 9 : 0,12 = 75.` },
  { n: 12, text: `Hình nào bị thiếu?`, img: ['img/q12_grid.png','img/q12_opts.png'], imgW: [260, 620],
    opts: ['Hình A','Hình B','Hình C','Hình D'], cols: 4, ans: 'C',
    sol: `Đáp án theo đề: <b>C</b> (vòng tròn rỗng, không có đường nối).<br>
      Gợi ý quy luật: ở hàng 3, số đường nối giảm dần (ô 1 và ô 2 mỗi ô chỉ còn 1 đường) và kí hiệu trong vòng tròn của cột 3 lặp lại cột 1 (⊘, ○, ○) ⇒ ô còn thiếu là vòng tròn rỗng, không còn đường nối.
      <div class="note">Lời giải câu hình này mang tính tham khảo – đề không kèm giải thích quy luật.</div>` },
  { n: 13, text: `Nam, Hùng, Hoa, Hải và Bình cùng đứng trong một hàng. Hoa đứng trước Hùng 3 mét, Bình đứng sau Nam 4 mét, Nam đứng sau Hoa 5 mét, Hải đứng sau Bình 6 mét. Hỏi hàng đó dài bao nhiêu mét?`,
    opts: ['14 mét','18 mét','12 mét','15 mét'], cols: 4, ans: 'D',
    sol: `Đặt Hoa ở vị trí 0 (đầu hàng): Hùng = 3, Nam = 5, Bình = 5 + 4 = 9, Hải = 9 + 6 = 15.<br>
      Hàng dài từ Hoa đến Hải = 15 mét.` },
  { n: 14, text: `Mẹ hơn con 20 tuổi. Mười năm nữa, tuổi của con bằng một nửa tuổi của mẹ. Hỏi tuổi của mẹ hiện nay là bao nhiêu?`,
    opts: ['25','30','32','35'], cols: 4, ans: 'B',
    sol: `Hiệu số tuổi luôn là 20. Mười năm nữa con = ½ mẹ ⇒ mẹ gấp đôi con ⇒ con lúc đó = 20 tuổi, mẹ = 40 tuổi.<br>
      Hiện nay mẹ 40 − 10 = 30 tuổi.` },
  { n: 15, text: `Chọn số thích hợp điền vào dấu hỏi chấm.`, img: ['img/q15.png'], imgW: 560,
    opts: ['5','7','3','9'], cols: 4, ans: 'B',
    sol: `Quy luật: ô giữa = ô trên − ô trái = ô dưới − ô phải.<br>
      Hình 1: 5 − 2 = 11 − 8 = 3. Hình 2: 9 − 4 = 19 − 14 = 5.<br>
      Hình 3: 13 − 6 = 27 − 20 = <b>7</b>.` },
  { n: 16, text: `Có ba đồng xu giống nhau được thả đồng thời. Hỏi xác suất để có hai mặt sấp và một mặt ngửa?`,
    opts: [F(1,8), F(3,8), F(5,8), F(1,4)], cols: 4, ans: 'B',
    sol: `Không gian mẫu: 2³ = 8 kết quả. Hai sấp một ngửa: SSN, SNS, NSS → 3 kết quả.<br>P = ${F(3,8)}.` },
  { n: 17, text: `Hôm nay là thứ tư. Hỏi 80 ngày nữa kể từ hôm nay là thứ mấy?`,
    opts: ['Thứ 6','Thứ 4','Thứ 7','Thứ 5'], cols: 4, ans: 'C',
    sol: `80 = 7 × 11 + 3 ⇒ sau 80 ngày tương đương sau 3 ngày: thứ tư + 3 = <b>thứ bảy</b>.` },
  { n: 18, text: `Số nào trong các số sau bé hơn ${F(5,9)}?`,
    opts: [F(21,36), F(55,100), F(25,45), F(5,8)], cols: 4, ans: 'B',
    sol: `${F(5,9)} ≈ 0,5556.<br>${F(21,36)} ≈ 0,583; ${F(55,100)} = 0,55; ${F(25,45)} = ${F(5,9)}; ${F(5,8)} = 0,625.<br>Chỉ ${F(55,100)} bé hơn ${F(5,9)}.` },
  { n: 19, text: `Nếu từ HOCCAO tương ứng với số 863316 thì từ CAOHOC tương ứng với số mấy?`,
    opts: ['316863','386163','361863','368163'], cols: 4, ans: 'A',
    sol: `H = 8, O = 6, C = 3, A = 1.<br>CAOHOC → C A O H O C = 3 1 6 8 6 3 = 316863.` },
  { n: 20, text: `Mai mua 29 quả gồm cam và táo với tổng số tiền là 385 nghìn đồng. Biết rằng giá một quả táo là 25 nghìn đồng và giá một quả cam là 8 nghìn đồng, hỏi rằng Mai đã mua bao nhiêu quả táo?`,
    opts: ['9','20','10','8'], cols: 4, ans: 'A',
    sol: `Gọi số táo là t ⇒ số cam là 29 − t.<br>25t + 8(29 − t) = 385 ⇒ 17t + 232 = 385 ⇒ 17t = 153 ⇒ t = 9.` },
  { n: 21, text: `Cho ΔABC với đường cao AH, biết rằng AB = 10, BC = 12, AH = 6. Diện tích của ΔABC là:`,
    img: ['img/q21.png'], imgW: 420, opts: ['30','36','60','3600'], cols: 4, ans: 'B',
    sol: `S = ½ · BC · AH = ½ · 12 · 6 = 36. (Độ dài AB = 10 là dữ kiện gây nhiễu.)` },
  { n: 22, text: `Nếu x = −1 thì ${F('x² − x','−3x')} = ?`,
    opts: ['0','1','−' + F(2,3), F(2,3)], cols: 4, ans: 'D',
    sol: `Tử: (−1)² − (−1) = 1 + 1 = 2. Mẫu: −3·(−1) = 3. ⇒ Giá trị = ${F(2,3)}.` },
  { n: 23, text: `Hình nào tiếp theo dãy hình trên?`, img: ['img/q23_seq.png','img/q23_opts.png'], imgW: [680, 680],
    opts: ['Hình A','Hình B','Hình C','Hình D'], cols: 4, ans: 'D',
    sol: `Quan sát ô dưới của mỗi hình:<br>
      • Đường chéo ở ô dưới-phải luân phiên: / , \\ , / , \\ , / ⇒ hình tiếp theo là <b>\\</b> (loại B).<br>
      • Vạch ngang ở ô dưới-trái luân phiên: trên, dưới, trên, dưới, trên ⇒ hình tiếp theo vạch nằm <b>dưới</b> (loại A, C).<br>
      ⇒ Chỉ có hình D thỏa mãn.` },
  { n: 24, text: `Nếu ${F(1,3)} của 2x bằng 5 thì ${F(2,3)} của 4x bằng bao nhiêu?`,
    opts: ['10','20','15','5'], cols: 4, ans: 'B',
    sol: `${F(2,3)} · 4x = 4 · (${F(1,3)} · 2x) = 4 · 5 = 20.` },
  { n: 25, text: `Nếu ${F('x','a')} = 4, ${F('a','y')} = 6, a² = 9 và ab² = −8 thì x + 2y = ?`,
    opts: ['−2','−10','−13','−5'], cols: 4, ans: 'C',
    sol: `ab² = −8 < 0 mà b² > 0 ⇒ a < 0. Kết hợp a² = 9 ⇒ a = −3.<br>
      x = 4a = −12; y = ${F('a',6)} = −${F(1,2)}.<br>x + 2y = −12 − 1 = −13.` },

  // ===== PHẦN II: KIẾN THỨC KINH TẾ - XÃ HỘI =====
  { n: 26, text: `Nếu không có sự can thiệp của nhà nước, độc quyền sẽ gây ra tình trạng`,
    opts: ['định giá cao hơn so với mức giá cạnh tranh.','công ty độc quyền được hưởng siêu lợi nhuận.','sản lượng được cung cấp trên thị trường thấp hơn mức xã hội mong muốn.','Cả ba hệ quả trên.'], cols: 1, ans: 'D',
    sol: `Doanh nghiệp độc quyền đặt giá P > MC, cung ứng sản lượng thấp hơn mức hiệu quả xã hội và thu lợi nhuận siêu ngạch ⇒ cả ba hệ quả đều đúng.` },

  { n: 36, text: `Có nhận định cho rằng "doanh nghiệp có thời gian hoạt động càng dài thì càng ít đổi mới sáng tạo". Lập luận nào dưới đây hỗ trợ cho nhận định này?`,

  { n: 46, text: `Yếu tố nào dưới đây KHÔNG phải là yếu tố sản xuất cơ bản?`,

    opts: ['Việt Nam chỉ có thể trao đổi thương mại với Nhật Bản nếu các doanh nghiệp Nhật Bản không có khả năng đáp ứng hết nhu cầu nội địa.','Việt Nam chỉ có thể trao đổi thương mại với Nhật Bản nếu Chính phủ Việt Nam được phép trợ cấp để giảm giá thành một trong hai mặt hàng nói trên.','Việt Nam vẫn có thể trao đổi thương mại bình đẳng với Nhật Bản bằng cách chuyên môn hóa sản xuất mặt hàng mà Việt Nam có giá thành rẻ hơn tương đối so với Nhật Bản.','hai nước sẽ không có trao đổi thương mại vì Việt Nam không thể cạnh tranh trong sản xuất cả hai mặt hàng so với Nhật Bản.'], cols: 1, ans: 'C',
    sol: `Theo lý thuyết lợi thế so sánh (Ricardo), dù bất lợi tuyệt đối ở cả hai mặt hàng, Việt Nam vẫn có lợi khi chuyên môn hóa mặt hàng có chi phí cơ hội thấp hơn (rẻ hơn tương đối) và trao đổi.` },
  { n: 59, text: `<i>"Tuấn kiệt như sao buổi sớm<br>Nhân tài như lá mùa thu"</i><br>là hai câu trích từ tác phẩm nào?`,
    opts: ['Hịch tướng sĩ','Văn tế nghĩa sĩ Cần Giuộc','Bình Ngô đại cáo','Chiếu dời đô'], cols: 2, ans: 'C',
    sol: `Hai câu trong "Bình Ngô đại cáo" (Nguyễn Trãi), nói về những khó khăn buổi đầu khởi nghĩa Lam Sơn khi nhân tài hiếm hoi.` },
  { n: 60, text: `Gia tăng dân số được tính bằng`,
    opts: ['tỉ suất gia tăng dân số tự nhiên.','tỉ suất sinh cộng với tỉ lệ di cư.','tỉ suất gia tăng dân số tự nhiên và cơ học.','tỉ suất sinh trừ tỉ suất chết.'], cols: 1, ans: 'C',
    sol: `Gia tăng dân số = gia tăng tự nhiên (sinh − tử) + gia tăng cơ học (nhập cư − xuất cư).` },
  { n: 61, text: `Slogan của du lịch Việt Nam hiện nay là`,
    opts: ['"Việt Nam - Vẻ đẹp tiềm ẩn"','"Việt Nam - Vẻ đẹp bất tận"','"Hãy đến với Việt Nam"','"Việt Nam - Điểm đến của thiên niên kỷ mới"'], cols: 2, ans: 'B',
    sol: `Từ năm 2012, slogan du lịch Việt Nam là "Việt Nam – Vẻ đẹp bất tận" (Timeless Charm). "Vẻ đẹp tiềm ẩn" là slogan giai đoạn 2006–2011.` },
  { n: 62, text: `Chức năng của nhà lãnh đạo là`,
    opts: ['bố trí lực lượng thực hiện các mục tiêu của tổ chức.','động viên, khuyến khích nhân viên.','vạch ra các mục tiêu, phương hướng phát triển của tổ chức.','Tất cả các chức năng trên.'], cols: 1, ans: 'D',
    sol: `Nhà lãnh đạo vừa định hướng (vạch mục tiêu), vừa tổ chức lực lượng, vừa tạo động lực cho nhân viên ⇒ tất cả.` },
  { n: 63, text: `Khi tiền lương lao động trực tiếp tăng lên thì`,
    opts: ['tổng chi phí trung bình và chi phí biến đổi trung bình tăng lên','tổng chi phí trung bình, chi phí biến đổi trung bình và chi phí cố định trung bình đều tăng lên','tổng chi phí, chi phí biến đổi và chi phí cố định đều tăng lên','Không điều nào ở trên'], cols: 1, ans: 'A',
    sol: `Lương lao động trực tiếp là chi phí biến đổi ⇒ VC, AVC tăng ⇒ ATC = AFC + AVC tăng. Chi phí cố định (FC, AFC) không đổi.` },
  { n: 64, text: `Đặc điểm nào dưới đây KHÔNG PHẢI của quốc gia có thu nhập thấp?`,
    opts: ['Thiếu cơ sở hạ tầng','Tiết kiệm thấp','GNP bình quân đầu người trên 2500 USD/năm','Tuổi thọ bình quân thấp'], cols: 2, ans: 'C',
    sol: `Quốc gia thu nhập thấp có GNP bình quân đầu người rất thấp (khoảng dưới 1.000 USD/năm theo WB), không thể trên 2.500 USD/năm.` },
  { n: 65, text: `Sự hấp dẫn của Hội An đối với du khách quốc tế là nhờ`,
    opts: ['các triển lãm hội họa.','Festival pháo hoa quốc tế.','khung cảnh yên bình của phố cổ mang nét đặc trưng riêng.','các buổi biểu diễn giao hưởng.'], cols: 1, ans: 'C',
    sol: `Hội An là Di sản văn hóa thế giới (UNESCO 1999) nổi tiếng với phố cổ yên bình, kiến trúc độc đáo. Festival pháo hoa quốc tế gắn với Đà Nẵng.` },
];

const LETTERS = ['A','B','C','D'];
const STORE_KEY = 'ntlc345_state_v1';
let state = { answers: {}, submitted: false, startedAt: Date.now(), elapsed: 0 };

function load() {
  try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && s.answers) state = s; } catch (e) {}
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}

function render() {
  const quiz = document.getElementById('quiz');
  const nav = document.getElementById('nav');
  let html = '', navHtml = '';
  QUESTIONS.forEach(q => {
    if (q.n === 1) html += `<h2 class="part-title">PHẦN I: TOÁN – LOGIC (Câu 1–25)</h2>`;
    if (q.n === 26) html += `<h2 class="part-title">PHẦN II: KIẾN THỨC VỀ KINH TẾ – XÃ HỘI (Câu 26–65)</h2>`;
    const imgs = (q.img || []).map((src, i) => {
      const w = Array.isArray(q.imgW) ? q.imgW[i] : q.imgW;
      return `<img class="qimg" src="${src}" alt="Hình câu ${q.n}" style="width:${w}px">`;
    }).join('');
    const cols = q.cols === 4 ? 'cols4' : q.cols === 2 ? 'cols2' : '';
    const opts = q.opts.map((o, i) => `
      <label class="opt" data-q="${q.n}" data-l="${LETTERS[i]}">
        <input type="radio" name="q${q.n}" value="${LETTERS[i]}">
        <span class="L">${LETTERS[i]}</span><span>${o}</span>
      </label>`).join('');
    html += `
      <div class="q" id="q${q.n}">
        <div class="qhead"><span class="num">Câu ${q.n}:</span></div>
        <div class="qtext">${q.text}</div>
        ${imgs}
        <div class="opts ${cols}">${opts}</div>
        <div class="foot">
          <span class="verdict" id="v${q.n}"></span>
          <button class="btn-sol" data-q="${q.n}">Xem lời giải</button>
        </div>
        <div class="sol" id="s${q.n}"><div>Đáp án: <span class="ans">${q.ans}</span></div><div>${q.sol}</div></div>
      </div>`;
    navHtml += `<a href="#q${q.n}" id="n${q.n}">${q.n}</a>`;
  });
  quiz.innerHTML = html;
  nav.innerHTML = navHtml;

  quiz.addEventListener('click', e => {
    const opt = e.target.closest('.opt');
    if (opt && !state.submitted) {
      state.answers[opt.dataset.q] = opt.dataset.l;
      save(); refresh();
      return;
    }
    const b = e.target.closest('.btn-sol');
    if (b) {
      const s = document.getElementById('s' + b.dataset.q);
      s.classList.toggle('show');
      b.textContent = s.classList.contains('show') ? 'Ẩn lời giải' : 'Xem lời giải';
    }
  });
}

function refresh() {
  let answered = 0;
  QUESTIONS.forEach(q => {
    const a = state.answers[q.n];
    if (a) answered++;
    const card = document.getElementById('q' + q.n);
    const nav = document.getElementById('n' + q.n);
    card.classList.toggle('done', state.submitted);
    card.classList.remove('correct', 'wrong', 'skipped');
    nav.className = '';
    card.querySelectorAll('.opt').forEach(o => {
      const l = o.dataset.l;
      o.classList.toggle('sel', !state.submitted && l === a);
      o.classList.toggle('is-ans', state.submitted && l === q.ans);
      o.classList.toggle('is-wrong', state.submitted && l === a && a !== q.ans);
    });
    const v = document.getElementById('v' + q.n);
    if (state.submitted) {
      const cls = !a ? 'skipped' : a === q.ans ? 'correct' : 'wrong';
      card.classList.add(cls); nav.classList.add(cls);
      v.className = 'verdict ' + (!a ? 'skip' : a === q.ans ? 'ok' : 'bad');
      v.textContent = !a ? `Chưa làm — đáp án ${q.ans}` : a === q.ans ? '✔ Đúng' : `✘ Sai — bạn chọn ${a}, đáp án ${q.ans}`;
    } else {
      v.textContent = '';
      if (a) nav.classList.add('answered');
    }
  });
  document.getElementById('cnt').textContent = answered;
  ['btnSubmit', 'btnSubmit2'].forEach(id => document.getElementById(id).disabled = state.submitted);
  showResult();
}

function showResult() {
  const box = document.getElementById('result');
  if (!state.submitted) { box.classList.remove('show'); return; }
  const score = (from, to) => QUESTIONS.filter(q => q.n >= from && q.n <= to && state.answers[q.n] === q.ans).length;
  const p1 = score(1, 25), p2 = score(26, 65), total = p1 + p2;
  const skipped = QUESTIONS.filter(q => !state.answers[q.n]).length;
  box.innerHTML = `
    <div>Kết quả: <span class="big">${total}/65</span> câu đúng (${(total / 65 * 100).toFixed(1)}%)</div>
    <div>Phần I – Toán Logic: <b>${p1}/25</b> &nbsp;·&nbsp; Phần II – Kinh tế – Xã hội: <b>${p2}/40</b></div>
    <div>Sai: <b>${65 - total - skipped}</b> &nbsp;·&nbsp; Bỏ trống: <b>${skipped}</b> &nbsp;·&nbsp; Thời gian: <b>${fmt(state.elapsed)}</b></div>
    <div class="note">Bấm vào số câu trong bảng để đến câu đó; bấm "Xem lời giải" ở từng câu để xem giải chi tiết.</div>`;
  box.classList.add('show');
}

function submit() {
  const left = QUESTIONS.filter(q => !state.answers[q.n]).length;
  if (left && !confirm(`Bạn còn ${left} câu chưa làm. Vẫn nộp bài?`)) return;
  state.elapsed = Math.floor((Date.now() - state.startedAt) / 1000);
  state.submitted = true;
  save(); refresh();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function reset() {
  if (!confirm('Xóa toàn bộ bài làm và làm lại từ đầu?')) return;
  state = { answers: {}, submitted: false, startedAt: Date.now(), elapsed: 0 };
  save();
  document.querySelectorAll('.sol').forEach(s => s.classList.remove('show'));
  document.querySelectorAll('.btn-sol').forEach(b => b.textContent = 'Xem lời giải');
  refresh();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showAll() {
  const btn = document.getElementById('btnShowAll');
  const open = btn.dataset.open !== '1';
  document.querySelectorAll('.sol').forEach(s => s.classList.toggle('show', open));
  document.querySelectorAll('.btn-sol').forEach(b => b.textContent = open ? 'Ẩn lời giải' : 'Xem lời giải');
  btn.dataset.open = open ? '1' : '0';
  btn.textContent = open ? 'Ẩn tất cả lời giải' : 'Xem tất cả lời giải';
}

const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
function tick() {
  const s = state.submitted ? state.elapsed : Math.floor((Date.now() - state.startedAt) / 1000);
  document.getElementById('timer').textContent = fmt(s);
}

load();
render();
refresh();
tick(); setInterval(tick, 1000);
document.getElementById('btnSubmit').onclick = submit;
document.getElementById('btnSubmit2').onclick = submit;
document.getElementById('btnReset').onclick = reset;
document.getElementById('btnShowAll').onclick = showAll;
</script>
</body>
